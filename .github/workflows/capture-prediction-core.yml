name: Capture prediction core validation
on:
  push:
    branches: ['codex/gpu-capture-prediction']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prediction-core:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - name: Apply reviewed source and build-registration deltas
        run: |
          git apply --check scripts/ci/latency-source.patch
          git apply scripts/ci/latency-source.patch
          git apply --check scripts/ci/capture-prediction-cmake.patch
          git apply scripts/ci/capture-prediction-cmake.patch
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile prediction controller and real D3D12 shaders
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B out/prediction -G Ninja -DCMAKE_BUILD_TYPE=Release -DVEYRA_ENABLE_DEINTERLACE=OFF
          cmake --build out/prediction --parallel 2 --target veyra_capture_prediction_tests veyra_capture_prediction_gpu_tests
      - name: Test timing and actual forecast pixels on D3D12 WARP
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          out/prediction/veyra_capture_prediction_tests.exe | Tee-Object out/prediction/clock-results.txt
          out/prediction/veyra_capture_prediction_gpu_tests.exe | Tee-Object out/prediction/gpu-results.txt
      - name: Retain development test harness and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capture-Prediction-Core-Development
          path: |
            out/prediction/*.exe
            out/prediction/*results.txt
            out/prediction/shaders/*.dxil
          retention-days: 14
